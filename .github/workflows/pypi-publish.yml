# Publishes django-grpc to PyPI on every push to master, then tags the commit
# and creates the matching GitHub release.
#
# DO NOT RENAME OR MOVE THIS FILE. Two things are keyed on its path:
#   1. PyPI trusted publishing (repo + this filename + environment "pypi").
#   2. github.run_number, a per-workflow-file counter that supplies the patch version.
# Renaming breaks authentication and restarts the version counter at 1.
#
# Version scheme: <major>.<minor> read from pyproject.toml, patch = github.run_number.
# To start a new series run `poetry version minor` (1.2.0 -> 1.3.0) and commit it.

name: Upload Python Package

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and print the version, but do not publish or tag'
        type: boolean
        default: false

permissions:
  contents: read

# Never publish two versions at once. Not cancel-in-progress: killing a run
# mid-upload would leave PyPI and the tags out of sync.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute version and inject it into pyproject.toml
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          path = pathlib.Path("pyproject.toml")
          raw = path.read_text(encoding="utf-8")

          base = tomllib.loads(raw)["tool"]["poetry"]["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)(?:\..*)?", base)
          if not match:
              sys.exit(f"cannot parse major.minor out of pyproject version {base!r}")

          version = f"{match.group(1)}.{match.group(2)}.{os.environ['RUN_NUMBER']}"

          new, count = re.subn(r'(?m)^version = ".*"$', f'version = "{version}"', raw)
          if count != 1:
              sys.exit(f"expected exactly one top-level version line, found {count}")
          path.write_text(new, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
          print(f"::notice title=Version::building {version}")
          PY

      # run_number is monotonic per workflow file, but it restarts at 1 if the workflow
      # entity is ever recreated. Together with skip-existing below that would silently
      # tag a release whose artifacts on PyPI came from a different commit.
      - name: Refuse to build a version that is not ahead of PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request

          version = os.environ["VERSION"]
          major, minor, patch = version.split(".")
          patch = int(patch)

          try:
              with urllib.request.urlopen("https://pypi.org/pypi/django-grpc/json", timeout=30) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print(f"::warning title=PyPI check skipped::{exc}")
              sys.exit(0)

          prefix = f"{major}.{minor}."
          highest = -1
          for released in data.get("releases", {}):
              if released.startswith(prefix):
                  try:
                      highest = max(highest, int(released[len(prefix):]))
                  except ValueError:
                      continue

          if highest >= patch:
              sys.exit(
                  f"refusing to build {version}: PyPI already has {prefix}{highest}. "
                  "github.run_number has gone backwards, most likely because the workflow "
                  "entity was recreated. Bump the minor version in pyproject.toml."
              )
          print(f"::notice title=PyPI check::{version} is ahead of "
                f"{prefix + str(highest) if highest >= 0 else 'anything published'}")
          PY

      - name: Build release distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist/

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          # re-running all jobs would otherwise 409 on the existing artifact
          overwrite: true

  pypi-publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing. The publish
      # step must also stay inline in this file: moving it into a reusable workflow
      # changes the OIDC job_workflow_ref claim and PyPI rejects it.
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/django-grpc/${{ needs.build.outputs.version }}/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Lets a run that failed after upload (e.g. while tagging) be re-run to
          # completion. Safe only because the build job asserts monotonicity above.
          skip-existing: true

  tag-and-release:
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release::$TAG already exists, nothing to do"
            exit 0
          fi

          # gh creates the tag itself at --target, so no git tag/push is needed.
          # Releases created with GITHUB_TOKEN do not trigger workflows, and the push
          # trigger above is branch-only, so this cannot re-trigger the workflow.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/*
