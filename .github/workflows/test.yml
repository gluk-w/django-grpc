name: Test with tox

on:
  # master is covered by the release workflow, which calls this one as its gate.
  # Excluding it here avoids running the suite twice on every merge.
  push:
    branches-ignore:
      - master
      - 'dependabot/**'
  # Dependabot branches and forks are covered here instead.
  pull_request:
    branches: [master]
  # Called by pypi-publish.yml before anything is published.
  workflow_call:

permissions:
  contents: read

jobs:
  tox:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox and any other packages
        # Pinned: this job is now the only gate in front of a PyPI upload.
        run: pip install "poetry==2.4.1" "tox==4.60.1"
      - name: Install dependencies
        run: poetry install
      - name: Run tox
        run: poetry run tox
